<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산공업고등학교 식품생명과학과 카페 키오스크</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .menu-card {
            transition: all 0.3s ease;
            cursor: pointer;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .menu-card.selected {
            border: 3px solid #4ade80;
            background: #dcfce7;
            animation: pulse 0.6s ease-in-out;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4ade80;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .order-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4ade80;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }
        
        .order-notification.show {
            transform: translateX(0);
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-pending { background: #fbbf24; color: #92400e; }
        .status-preparing { background: #3b82f6; color: white; }
        .status-ready { background: #10b981; color: white; }
        .status-completed { background: #6b7280; color: white; }
    </style>
</head>
<body>
    <!-- 주문 완료 알림 -->
    <div id="orderNotification" class="order-notification">
        <div class="flex items-center gap-3">
            <i class="fas fa-check-circle"></i>
            <span id="notificationText">주문이 완료되었습니다!</span>
        </div>
    </div>

    <div class="container mx-auto px-4 py-6">
        <!-- 헤더 -->
        <div class="bg-white p-6 rounded-2xl shadow-lg mb-6 text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">계산공업고등학교 식품생명과학과 카페</h1>
            <p class="text-gray-600">맛있는 커피와 디저트로 여러분을 맞이합니다</p>
            <div class="mt-4 flex justify-center gap-4 text-sm">
                <div class="bg-blue-100 px-3 py-1 rounded-full">
                    <i class="fas fa-clock mr-1"></i>
                    운영시간: 08:00-17:00
                </div>
                <div class="bg-green-100 px-3 py-1 rounded-full">
                    <i class="fas fa-users mr-1"></i>
                    학생할인 10%
                </div>
            </div>
        </div>

        <!-- 메인 컨텐츠 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 메뉴 섹션 (왼쪽 2/3) -->
            <div class="lg:col-span-2">
                <!-- 카테고리 버튼 -->
                <div class="bg-white p-4 rounded-xl shadow-lg mb-6">
                    <div class="flex flex-wrap justify-center gap-2">
                        <button class="category-btn px-6 py-2 rounded-full border-2 transition-all duration-300 font-medium" data-category="all">
                            전체 메뉴
                        </button>
                        <button class="category-btn px-6 py-2 rounded-full border-2 transition-all duration-300 font-medium" data-category="coffee">
                            <i class="fas fa-coffee mr-1"></i>커피
                        </button>
                        <button class="category-btn px-6 py-2 rounded-full border-2 transition-all duration-300 font-medium" data-category="non-coffee">
                            <i class="fas fa-glass-whiskey mr-1"></i>논커피
                        </button>
                        <button class="category-btn px-6 py-2 rounded-full border-2 transition-all duration-300 font-medium" data-category="dessert">
                            <i class="fas fa-birthday-cake mr-1"></i>디저트
                        </button>
                        <button class="category-btn px-6 py-2 rounded-full border-2 transition-all duration-300 font-medium" data-category="bakery">
                            <i class="fas fa-bread-slice mr-1"></i>베이커리
                        </button>
                    </div>
                </div>

                <!-- 메뉴 그리드 -->
                <div id="menuGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                    <div class="col-span-full text-center py-8">
                        <div class="loading"></div>
                        <p class="mt-2 text-gray-600">메뉴를 불러오는 중...</p>
                    </div>
                </div>
            </div>

            <!-- 장바구니 섹션 (오른쪽 1/3) -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-lg p-6 sticky top-6">
                    <!-- 장바구니 헤더 -->
                    <div class="flex items-center justify-between mb-6 pb-4 border-b-2 border-gray-100">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-shopping-cart text-green-500 text-xl"></i>
                            <h3 class="text-xl font-bold text-gray-800">주문 내역</h3>
                            <span id="cartCount" class="bg-green-500 text-white px-2 py-1 rounded-full text-sm font-bold">0</span>
                        </div>
                        <button onclick="clearCart()" class="text-red-500 hover:text-red-700 transition-colors">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>

                    <!-- 고객 구분 선택 -->
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">고객 구분</label>
                        <select id="customerType" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
                            <option value="student">학생 (10% 할인)</option>
                            <option value="teacher">교직원</option>
                            <option value="visitor">방문자</option>
                        </select>
                    </div>

                    <!-- 장바구니 아이템 -->
                    <div id="cartItems" class="mb-6">
                        <div class="text-center py-12 text-gray-500">
                            <i class="fas fa-shopping-cart text-4xl mb-4"></i>
                            <p>장바구니가 비어있습니다.<br>메뉴를 선택해주세요.</p>
                        </div>
                    </div>

                    <!-- 할인 및 총액 -->
                    <div id="totalSection" class="bg-gradient-to-r from-green-500 to-green-600 text-white p-4 rounded-xl mb-4 hidden">
                        <div class="flex justify-between items-center mb-2">
                            <span>소계</span>
                            <span id="subtotal">₩0</span>
                        </div>
                        <div id="discountRow" class="flex justify-between items-center mb-2 text-green-200 hidden">
                            <span>할인</span>
                            <span id="discountAmount">-₩0</span>
                        </div>
                        <hr class="border-green-400 mb-2">
                        <div class="flex justify-between items-center text-lg font-bold">
                            <span>총 결제금액</span>
                            <span id="totalAmount">₩0</span>
                        </div>
                    </div>

                    <!-- 주문하기 버튼 -->
                    <button id="orderBtn" onclick="processOrder()" disabled 
                            class="w-full bg-gradient-to-r from-orange-400 to-orange-500 text-white py-4 rounded-xl font-bold text-lg transition-all duration-300 disabled:from-gray-300 disabled:to-gray-400 disabled:cursor-not-allowed hover:shadow-lg transform hover:-translate-y-1 disabled:transform-none">
                        <i class="fas fa-credit-card mr-2"></i>
                        주문하기
                    </button>

                    <!-- 최근 주문 현황 -->
                    <div class="mt-6 pt-6 border-t border-gray-200">
                        <h4 class="font-bold text-gray-800 mb-3 flex items-center gap-2">
                            <i class="fas fa-clock text-blue-500"></i>
                            최근 주문 현황
                        </h4>
                        <div id="recentOrders" class="space-y-2 max-h-32 overflow-y-auto">
                            <div class="text-center text-gray-500 text-sm py-4">
                                주문 내역이 없습니다
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 주문 완료 모달 -->
    <div id="orderModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4 text-center">
            <i class="fas fa-check-circle text-6xl text-green-500 mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-800 mb-3">주문이 완료되었습니다!</h2>
            <div class="bg-gray-100 p-4 rounded-lg mb-6">
                <p class="text-sm text-gray-600 mb-2">주문번호</p>
                <p class="text-2xl font-bold text-gray-800" id="orderNumber">KS0001</p>
            </div>
            <p class="text-gray-600 mb-6">주문이 접수되었습니다.<br>잠시만 기다려주세요.</p>
            <button onclick="closeModal()" class="w-full bg-green-500 text-white py-3 rounded-lg font-medium hover:bg-green-600 transition-colors">
                확인
            </button>
        </div>
    </div>

    <script>
        // 전역 변수
        let cart = [];
        let orderCounter = 1001;
        let currentCategory = 'all';
        
        // API 기본 URL
        const API_BASE = '';

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', async function() {
            await initializeApp();
        });

        // 앱 초기화
        async function initializeApp() {
            try {
                await loadMenuData();
                setupCategoryButtons();
                setupCustomerTypeChange();
                updateCartDisplay();
                loadRecentOrders();
                
                // 10초마다 최근 주문 현황 업데이트
                setInterval(loadRecentOrders, 10000);
            } catch (error) {
                console.error('앱 초기화 중 오류:', error);
                showErrorMessage('시스템 초기화에 실패했습니다.');
            }
        }

        // 메뉴 데이터 로드
        async function loadMenuData() {
            try {
                // 기본 메뉴 데이터를 데이터베이스에 추가
                await ensureMenuData();
                displayMenuItems('all');
            } catch (error) {
                console.error('메뉴 데이터 로드 실패:', error);
                // 기본 메뉴 데이터로 fallback
                displayStaticMenuItems('all');
            }
        }

        // 기본 메뉴 데이터 확보
        async function ensureMenuData() {
            const staticMenuData = {
                coffee: [
                    {
                        id: 'americano',
                        name: '아메리카노',
                        price: 2000,
                        description: '깔끔하고 진한 에스프레소의 맛',
                        image_url: 'https://images.unsplash.com/photo-1551030173-122aabc4489c?w=300&h=200&fit=crop',
                        category: 'coffee',
                        available: true,
                        display_order: 1
                    },
                    {
                        id: 'cafe-latte',
                        name: '카페라떼',
                        price: 2500,
                        description: '부드러운 우유와 에스프레소의 조화',
                        image_url: 'https://images.unsplash.com/photo-1561047029-3000c68339ca?w=300&h=200&fit=crop',
                        category: 'coffee',
                        available: true,
                        display_order: 2
                    },
                    {
                        id: 'cappuccino',
                        name: '카푸치노',
                        price: 2500,
                        description: '풍부한 우유 거품이 올라간 커피',
                        image_url: 'https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=300&h=200&fit=crop',
                        category: 'coffee',
                        available: true,
                        display_order: 3
                    },
                    {
                        id: 'caramel-macchiato',
                        name: '카라멜 마키아토',
                        price: 3000,
                        description: '달콤한 카라멜과 에스프레소의 만남',
                        image_url: 'https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=300&h=200&fit=crop',
                        category: 'coffee',
                        available: true,
                        display_order: 4
                    }
                ],
                'non-coffee': [
                    {
                        id: 'green-tea-latte',
                        name: '녹차라떼',
                        price: 2800,
                        description: '진한 녹차와 부드러운 우유의 조화',
                        image_url: 'https://images.unsplash.com/photo-1515823064-d6e0c04616a7?w=300&h=200&fit=crop',
                        category: 'non-coffee',
                        available: true,
                        display_order: 1
                    },
                    {
                        id: 'chocolate-latte',
                        name: '초콜릿라떼',
                        price: 2800,
                        description: '진한 초콜릿의 달콤함',
                        image_url: 'https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?w=300&h=200&fit=crop',
                        category: 'non-coffee',
                        available: true,
                        display_order: 2
                    }
                ],
                dessert: [
                    {
                        id: 'tiramisu',
                        name: '티라미수',
                        price: 4000,
                        description: '이탈리안 정통 티라미수',
                        image_url: 'https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=300&h=200&fit=crop',
                        category: 'dessert',
                        available: true,
                        display_order: 1
                    },
                    {
                        id: 'cheesecake',
                        name: '치즈케이크',
                        price: 3500,
                        description: '부드럽고 진한 치즈케이크',
                        image_url: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=300&h=200&fit=crop',
                        category: 'dessert',
                        available: true,
                        display_order: 2
                    }
                ],
                bakery: [
                    {
                        id: 'croissant',
                        name: '크루아상',
                        price: 1800,
                        description: '바삭하고 고소한 프랑스 전통 빵',
                        image_url: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=300&h=200&fit=crop',
                        category: 'bakery',
                        available: true,
                        display_order: 1
                    },
                    {
                        id: 'bagel',
                        name: '베이글',
                        price: 2200,
                        description: '쫄깃한 식감의 건강한 빵',
                        image_url: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300&h=200&fit=crop',
                        category: 'bakery',
                        available: true,
                        display_order: 2
                    }
                ]
            };

            // 모든 메뉴 아이템을 하나의 배열로 합치기
            const allItems = Object.values(staticMenuData).flat();
            
            // 데이터베이스에 메뉴 데이터 추가
            for (const item of allItems) {
                try {
                    await fetch(`tables/menu_items`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(item)
                    });
                } catch (error) {
                    // 이미 존재하는 아이템일 경우 무시
                    console.log('메뉴 아이템 추가 스킵:', item.id);
                }
            }
        }

        // 정적 메뉴 데이터 표시 (fallback)
        function displayStaticMenuItems(category) {
            const staticMenuData = {
                coffee: [
                    {
                        id: 'americano',
                        name: '아메리카노',
                        price: 2000,
                        description: '깔끔하고 진한 에스프레소의 맛',
                        image_url: 'https://images.unsplash.com/photo-1551030173-122aabc4489c?w=300&h=200&fit=crop',
                        category: 'coffee'
                    },
                    {
                        id: 'cafe-latte',
                        name: '카페라떼',
                        price: 2500,
                        description: '부드러운 우유와 에스프레소의 조화',
                        image_url: 'https://images.unsplash.com/photo-1561047029-3000c68339ca?w=300&h=200&fit=crop',
                        category: 'coffee'
                    },
                    {
                        id: 'cappuccino',
                        name: '카푸치노',
                        price: 2500,
                        description: '풍부한 우유 거품이 올라간 커피',
                        image_url: 'https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=300&h=200&fit=crop',
                        category: 'coffee'
                    }
                ],
                'non-coffee': [
                    {
                        id: 'green-tea-latte',
                        name: '녹차라떼',
                        price: 2800,
                        description: '진한 녹차와 부드러운 우유의 조화',
                        image_url: 'https://images.unsplash.com/photo-1515823064-d6e0c04616a7?w=300&h=200&fit=crop',
                        category: 'non-coffee'
                    }
                ],
                dessert: [
                    {
                        id: 'tiramisu',
                        name: '티라미수',
                        price: 4000,
                        description: '이탈리안 정통 티라미수',
                        image_url: 'https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=300&h=200&fit=crop',
                        category: 'dessert'
                    }
                ],
                bakery: [
                    {
                        id: 'croissant',
                        name: '크루아상',
                        price: 1800,
                        description: '바삭하고 고소한 프랑스 전통 빵',
                        image_url: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=300&h=200&fit=crop',
                        category: 'bakery'
                    }
                ]
            };

            const menuGrid = document.getElementById('menuGrid');
            menuGrid.innerHTML = '';

            let itemsToDisplay = [];
            
            if (category === 'all') {
                itemsToDisplay = Object.values(staticMenuData).flat();
            } else {
                itemsToDisplay = staticMenuData[category] || [];
            }

            itemsToDisplay.forEach(item => {
                const menuCard = createMenuCard(item);
                menuGrid.appendChild(menuCard);
            });
        }

        // 메뉴 아이템 표시
        async function displayMenuItems(category) {
            const menuGrid = document.getElementById('menuGrid');
            menuGrid.innerHTML = '<div class="col-span-full text-center py-8"><div class="loading"></div><p class="mt-2 text-gray-600">메뉴를 불러오는 중...</p></div>';

            try {
                let url = `tables/menu_items?limit=100`;
                if (category !== 'all') {
                    url += `&search=${category}`;
                }
                
                const response = await fetch(url);
                const result = await response.json();
                
                menuGrid.innerHTML = '';
                
                let itemsToDisplay = result.data || [];
                
                // 카테고리 필터링 (서버 측 검색이 정확하지 않을 경우 클라이언트에서 추가 필터링)
                if (category !== 'all') {
                    itemsToDisplay = itemsToDisplay.filter(item => item.category === category);
                }
                
                // 사용 가능한 아이템만 표시
                itemsToDisplay = itemsToDisplay.filter(item => item.available !== false);
                
                // 표시 순서로 정렬
                itemsToDisplay.sort((a, b) => (a.display_order || 99) - (b.display_order || 99));

                if (itemsToDisplay.length === 0) {
                    menuGrid.innerHTML = '<div class="col-span-full text-center py-8 text-gray-500"><i class="fas fa-coffee text-4xl mb-4"></i><p>해당 카테고리에 메뉴가 없습니다.</p></div>';
                    return;
                }

                itemsToDisplay.forEach(item => {
                    const menuCard = createMenuCard(item);
                    menuGrid.appendChild(menuCard);
                });

            } catch (error) {
                console.error('메뉴 로드 실패:', error);
                // fallback to static data
                displayStaticMenuItems(category);
            }
        }

        // 메뉴 카드 생성
        function createMenuCard(item) {
            const card = document.createElement('div');
            card.className = 'menu-card bg-white rounded-2xl overflow-hidden shadow-lg hover:shadow-xl transition-all duration-300';
            card.innerHTML = `
                <div class="relative">
                    <img src="${item.image_url}" alt="${item.name}" 
                         class="w-full h-48 object-cover" 
                         onerror="this.src='https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=300&h=200&fit=crop'">
                    ${!item.available ? '<div class="absolute inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center"><span class="text-white font-bold">품절</span></div>' : ''}
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-lg text-gray-800 mb-2">${item.name}</h3>
                    <p class="text-gray-600 text-sm mb-3 leading-relaxed">${item.description}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-2xl font-bold text-green-600">₩${item.price.toLocaleString()}</span>
                        ${item.available !== false ? 
                            '<button class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition-colors"><i class="fas fa-plus"></i></button>' : 
                            '<button disabled class="bg-gray-300 text-gray-500 px-4 py-2 rounded-lg cursor-not-allowed"><i class="fas fa-ban"></i></button>'
                        }
                    </div>
                </div>
            `;

            if (item.available !== false) {
                card.addEventListener('click', () => addToCart(item));
            }
            
            return card;
        }

        // 카테고리 버튼 설정
        function setupCategoryButtons() {
            const categoryButtons = document.querySelectorAll('.category-btn');
            
            // 첫 번째 버튼을 기본 활성화
            categoryButtons[0].classList.add('bg-green-500', 'text-white', 'border-green-500');
            
            categoryButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // 모든 버튼 비활성화
                    categoryButtons.forEach(btn => {
                        btn.classList.remove('bg-green-500', 'text-white', 'border-green-500');
                        btn.classList.add('border-gray-300', 'text-gray-700', 'hover:border-green-500', 'hover:text-green-500');
                    });
                    
                    // 클릭한 버튼 활성화
                    this.classList.add('bg-green-500', 'text-white', 'border-green-500');
                    this.classList.remove('border-gray-300', 'text-gray-700', 'hover:border-green-500', 'hover:text-green-500');
                    
                    const category = this.dataset.category;
                    currentCategory = category;
                    displayMenuItems(category);
                });
            });
        }

        // 고객 구분 변경 처리
        function setupCustomerTypeChange() {
            const customerTypeSelect = document.getElementById('customerType');
            customerTypeSelect.addEventListener('change', updateCartDisplay);
        }

        // 장바구니에 아이템 추가
        function addToCart(item) {
            const existingItem = cart.find(cartItem => cartItem.id === item.id);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    ...item,
                    quantity: 1
                });
            }
            
            updateCartDisplay();
            showAddToCartAnimation();
        }

        // 장바구니 추가 애니메이션
        function showAddToCartAnimation() {
            const cartIcon = document.querySelector('.fa-shopping-cart');
            cartIcon.classList.add('animate-bounce');
            setTimeout(() => {
                cartIcon.classList.remove('animate-bounce');
            }, 600);
        }

        // 수량 업데이트
        function updateQuantity(itemId, change) {
            const item = cart.find(cartItem => cartItem.id === itemId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeFromCart(itemId);
                } else {
                    updateCartDisplay();
                }
            }
        }

        // 장바구니에서 아이템 제거
        function removeFromCart(itemId) {
            cart = cart.filter(item => item.id !== itemId);
            updateCartDisplay();
        }

        // 장바구니 전체 삭제
        function clearCart() {
            if (cart.length > 0) {
                if (confirm('장바구니를 비우시겠습니까?')) {
                    cart = [];
                    updateCartDisplay();
                }
            }
        }

        // 장바구니 표시 업데이트
        function updateCartDisplay() {
            const cartItems = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const totalSection = document.getElementById('totalSection');
            const subtotalElement = document.getElementById('subtotal');
            const discountRow = document.getElementById('discountRow');
            const discountAmount = document.getElementById('discountAmount');
            const totalAmount = document.getElementById('totalAmount');
            const orderBtn = document.getElementById('orderBtn');
            const customerType = document.getElementById('customerType').value;

            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fas fa-shopping-cart text-4xl mb-4"></i>
                        <p>장바구니가 비어있습니다.<br>메뉴를 선택해주세요.</p>
                    </div>
                `;
                totalSection.classList.add('hidden');
                orderBtn.disabled = true;
                cartCount.textContent = '0';
                return;
            }

            let cartHTML = '';
            let subtotal = 0;
            let totalItems = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                totalItems += item.quantity;
                
                cartHTML += `
                    <div class="bg-gray-50 rounded-xl p-4 mb-3">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex-1">
                                <h4 class="font-bold text-gray-800">${item.name}</h4>
                                <p class="text-sm text-gray-600">₩${item.price.toLocaleString()}</p>
                            </div>
                            <button onclick="removeFromCart('${item.id}')" class="text-red-500 hover:text-red-700 ml-2">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-3 bg-white rounded-lg p-2">
                                <button onclick="updateQuantity('${item.id}', -1)" class="w-8 h-8 bg-red-100 text-red-600 rounded-full flex items-center justify-center hover:bg-red-200 transition-colors">
                                    <i class="fas fa-minus text-xs"></i>
                                </button>
                                <span class="font-bold min-w-6 text-center">${item.quantity}</span>
                                <button onclick="updateQuantity('${item.id}', 1)" class="w-8 h-8 bg-green-100 text-green-600 rounded-full flex items-center justify-center hover:bg-green-200 transition-colors">
                                    <i class="fas fa-plus text-xs"></i>
                                </button>
                            </div>
                            <div class="font-bold text-green-600">₩${itemTotal.toLocaleString()}</div>
                        </div>
                    </div>
                `;
            });

            cartItems.innerHTML = cartHTML;
            
            // 할인 계산
            let discount = 0;
            if (customerType === 'student') {
                discount = Math.floor(subtotal * 0.1);
            }
            
            const finalTotal = subtotal - discount;
            
            subtotalElement.textContent = `₩${subtotal.toLocaleString()}`;
            
            if (discount > 0) {
                discountRow.classList.remove('hidden');
                discountAmount.textContent = `-₩${discount.toLocaleString()}`;
            } else {
                discountRow.classList.add('hidden');
            }
            
            totalAmount.textContent = `₩${finalTotal.toLocaleString()}`;
            totalSection.classList.remove('hidden');
            orderBtn.disabled = false;
            cartCount.textContent = totalItems.toString();
        }

        // 주문 처리
        async function processOrder() {
            if (cart.length === 0) {
                alert('장바구니가 비어있습니다.');
                return;
            }

            const customerType = document.getElementById('customerType').value;
            const orderNumber = `KS${String(orderCounter).padStart(4, '0')}`;
            orderCounter++;

            // 주문 데이터 준비
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            let discount = 0;
            if (customerType === 'student') {
                discount = Math.floor(subtotal * 0.1);
            }
            const totalAmount = subtotal - discount;

            const orderData = {
                order_number: orderNumber,
                items: cart.map(item => ({
                    id: item.id,
                    name: item.name,
                    price: item.price,
                    quantity: item.quantity,
                    subtotal: item.price * item.quantity
                })),
                subtotal: subtotal,
                discount: discount,
                total_amount: totalAmount,
                customer_type: customerType,
                status: 'pending',
                order_time: new Date().toISOString(),
                notes: ''
            };

            try {
                // 주문 저장
                const response = await fetch('tables/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    // 주문 완료 처리
                    document.getElementById('orderNumber').textContent = orderNumber;
                    document.getElementById('orderModal').classList.remove('hidden');
                    
                    // 알림 표시
                    showNotification(`주문번호 ${orderNumber}이 접수되었습니다!`);
                    
                    // 장바구니 비우기
                    cart = [];
                    updateCartDisplay();
                    
                    // 최근 주문 현황 새로고침
                    setTimeout(loadRecentOrders, 1000);
                } else {
                    throw new Error('주문 저장 실패');
                }
            } catch (error) {
                console.error('주문 처리 실패:', error);
                alert('주문 처리 중 오류가 발생했습니다. 다시 시도해주세요.');
            }
        }

        // 최근 주문 현황 로드
        async function loadRecentOrders() {
            try {
                const response = await fetch('tables/orders?limit=5&sort=created_at');
                const result = await response.json();
                const orders = result.data || [];

                const recentOrdersDiv = document.getElementById('recentOrders');
                
                if (orders.length === 0) {
                    recentOrdersDiv.innerHTML = '<div class="text-center text-gray-500 text-sm py-4">주문 내역이 없습니다</div>';
                    return;
                }

                let ordersHTML = '';
                orders.slice(0, 3).forEach(order => {
                    const statusClass = `status-${order.status}`;
                    const statusText = getStatusText(order.status);
                    const timeAgo = getTimeAgo(new Date(order.created_at));
                    
                    ordersHTML += `
                        <div class="flex justify-between items-center py-2 px-3 bg-gray-50 rounded-lg">
                            <div class="flex-1">
                                <div class="text-sm font-medium text-gray-800">${order.order_number}</div>
                                <div class="text-xs text-gray-500">${timeAgo}</div>
                            </div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                    `;
                });

                recentOrdersDiv.innerHTML = ordersHTML;
            } catch (error) {
                console.error('최근 주문 로드 실패:', error);
            }
        }

        // 상태 텍스트 반환
        function getStatusText(status) {
            const statusMap = {
                'pending': '접수중',
                'preparing': '준비중',
                'ready': '완료',
                'completed': '수령완료',
                'cancelled': '취소됨'
            };
            return statusMap[status] || status;
        }

        // 시간 차이 계산
        function getTimeAgo(date) {
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / (1000 * 60));
            
            if (minutes < 1) return '방금 전';
            if (minutes < 60) return `${minutes}분 전`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}시간 전`;
            return `${Math.floor(hours / 24)}일 전`;
        }

        // 알림 표시
        function showNotification(message) {
            const notification = document.getElementById('orderNotification');
            const notificationText = document.getElementById('notificationText');
            
            notificationText.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 4000);
        }

        // 에러 메시지 표시
        function showErrorMessage(message) {
            const notification = document.getElementById('orderNotification');
            const notificationText = document.getElementById('notificationText');
            
            notification.style.background = '#ef4444';
            notificationText.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
                notification.style.background = '#4ade80';
            }, 4000);
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('orderModal').classList.add('hidden');
        }

        // 모달 외부 클릭 시 닫기
        document.getElementById('orderModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
